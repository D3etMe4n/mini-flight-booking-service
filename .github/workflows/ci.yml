name: Java CI with Gradle

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Cache and configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Grant execution permission for gradlew wrapper
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Step 5: Execute unit tests and generate JaCoCo coverage report
      - name: Run Unit Tests
        run: ./gradlew test jacocoTestReport

      # Step 6: Upload test results
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

      # Step 7: Upload JaCoCo coverage report
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

